services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: biblioteca
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: biblioteca
    ports:
      - "5433:5432"
    volumes:
      - dados-biblioteca:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca -d biblioteca"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./BibliotecaApi
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Biblioteca: "Host=db;Port=5432;Database=biblioteca;Username=biblioteca;Password=biblioteca"
    ports:
      - "8080:8080"
      - "8081:8081"

volumes:
  dados-biblioteca:
